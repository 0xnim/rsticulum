[package]
name = "rsticulum-daemon"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
description = "rsticulum network daemon — mesh routing + ICN forwarder"

[[bin]]
name = "rsticulumd"
path = "src/main.rs"

[dependencies]
rsticulum-identity = { path = "../identity" }
rsticulum-transport = { path = "../transport" }
rsticulum-destination = { path = "../destination" }
rsticulum-packet = { path = "../packet" }
rsticulum-mesh = { path = "../mesh" }
rsticulum-interface = { path = "../interface" }
rsticulum-icn = { path = "../icn" }
rsticulum-channel = { path = "../channel" }
rsticulum-buffer = { path = "../buffer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
hex = "0.4"
toml = "0.8"
bincode = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
getrandom = "0.2"
ed25519-dalek = "2"
x25519-dalek = "2"
hmac = "0.12"
rand = "0.8"
rsticulum-crypto = { path = "../crypto" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
