[package]
name = "rsticulum-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cryptographic identity: Ed25519/X25519 keys, 16-byte RNS-compatible addresses"

[dependencies]
rsticulum-crypto = { version = "0.1.0", path = "../crypto" }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "serde"] }
blake3 = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1"
hex = "0.4"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
hkdf = "0.12"

[dev-dependencies]
rstest = "0.24"
serde_json = "1"
tempfile = "3"
