[package]
name = "rsticulum-transport"
version.workspace = true
edition.workspace = true
description = "RNS Transport: Link, Packet, Resource, proof handshake"

[dependencies]
rsticulum-identity = { path = "../identity" }
rsticulum-packet = { path = "../packet" }
rsticulum-destination = { path = "../destination" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
bincode = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
rand = "0.8"
ed25519-dalek = "2"
x25519-dalek = "2"

[dev-dependencies]
rstest = "0.24"
tempfile = "3"
